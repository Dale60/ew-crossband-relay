# EW cross-band bridge - nRF9151 DK

CONFIG_NRF_MODEM_LIB=y
CONFIG_LTE_LINK_CONTROL=y
# App owns %XSYSTEMMODE (terrestrial vs NTN); link control must not override.
CONFIG_LTE_NETWORK_MODE_DEFAULT=y
# NTN attach can be slow; generous connect timeout (seconds).
CONFIG_LTE_NETWORK_TIMEOUT=600

CONFIG_NETWORKING=y
CONFIG_NET_NATIVE=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_OFFLOAD=y

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_HEAP_MEM_POOL_SIZE=4096
